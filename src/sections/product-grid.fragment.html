<section class="py-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
  <div class="mb-8">
    <h2 class="text-3xl font-extrabold tracking-tight text-gray-200">{{title}}</h2>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    {{#each data.items}}
    <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow duration-300 border border-gray-100 p-6 flex flex-col justify-between">
      <div>
        {{#if showBadge}}
        <span class="inline-block bg-indigo-50 text-indigo-700 text-xs font-semibold px-2.5 py-0.5 rounded-full mb-3">
          New Release
        </span>
        {{/if}}
        <h3 class="text-lg font-bold text-gray-900 mb-1">{{name}}</h3>
      </div>
      <div class="mt-4 pt-4 border-t border-gray-50 flex items-center justify-between">
        <span class="text-xl font-extrabold text-indigo-600">{{#if price}}{{price}}{{else}}$0.00{{/if}}</span>
        <rx-button variant="ghost">
          View Item
        </rx-button>
      </div>
    </div>
    {{/each}}
  </div>
</section>
